[package]
name = "vivian-storage-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "../tests/storage_contracts.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
once_cell = "1"
jieba-rs = "0.7"
fs2 = "0.4"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
zstd = "0.13"
tempfile = "3"
thiserror = "2"
reqwest = { version = "0.12", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
