[package]
name = "vivian-companion-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "tests.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
once_cell = "1.20"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time"] }
