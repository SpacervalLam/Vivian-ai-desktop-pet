[package]
name = "vivian-runtime-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "../tests/runtime_contracts.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
once_cell = "1"
regex = "1"
png = "0.18"
jieba-rs = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Com"] }
