function totalDur(spec) {
  const fwd = spec.durations.reduce((a, b) => a + b, 0);
  if (!spec.pingpong || spec.frames < 2) return fwd;
  return 2 * fwd - spec.durations[0] - spec.durations[spec.frames - 1];
}

function buildSequence(spec) {
  const n = spec.frames;
  const last = spec.durations[n - 1] || 80;
  const seq = [], dur = [];
  for (let i = 0; i < n; i++) { seq.push(i); dur.push(spec.durations[i] ?? last); }
  if (spec.pingpong) {
    // 往返：正放 0..n-1 后倒放 n-2..1（回程不重复两端保持帧）
    for (let i = n - 2; i >= 1; i--) { seq.push(i); dur.push(spec.durations[i] ?? last); }
  }
  return { seq, dur };
}

class SpritePlayer {
  constructor(card, spec) {
    this.spec = spec;
    this.seq = buildSequence(spec);
    this.i = 0; this.acc = 0; this.playing = false; this.speed = 1;
    this.sprite = card.querySelector('.sprite');
    this.sprite.style.backgroundImage = `url('${spec.file}')`;
    this.bar = card.querySelector('.bar > div');
    this.frameLabel = card.querySelector('.frame-label');
    this.btn = card.querySelector('.play-btn');
    this.btn.addEventListener('click', () => this.toggle());
    card.querySelector('.replay-btn').addEventListener('click', () => this.restart());
    this.render();
  }
  render() {
    const f = this.seq.seq[this.i];
    const { cols, rows } = this.spec;
    const col = f % cols, row = Math.floor(f / cols) % rows;
    const x = cols > 1 ? (col * 100) / (cols - 1) : 0;
    const y = rows > 1 ? (row * 100) / (rows - 1) : 0;
    this.sprite.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
    this.sprite.style.backgroundPosition = `${x}% ${y}%`;
    this.frameLabel.textContent = `第 ${this.i + 1}/${this.seq.seq.length} 帧`;
    const total = this.seq.dur.reduce((a, b) => a + b, 0);
    const done = this.seq.dur.slice(0, this.i).reduce((a, b) => a + b, 0) + this.acc;
    this.bar.style.width = `${Math.min(100, (done / total) * 100)}%`;
  }
  toggle() { this.playing ? this.pause() : this.play(); }
  play() {
    if (this.playing) return;
    this.playing = true;
    this.btn.textContent = '⏸ 暂停';
    this.last = performance.now();
    this.loop();
  }
  pause() {
    this.playing = false;
    this.btn.textContent = '▶ 播放';
    if (this.raf) cancelAnimationFrame(this.raf);
  }
  restart() {
    this.i = 0; this.acc = 0;
    if (!this.playing) this.play();
    this.render();
  }
  loop() {
    if (!this.playing) return;
    const now = performance.now();
    this.acc += (now - this.last) * this.speed;
    this.last = now;
    let guard = 0;
    while (this.acc >= this.seq.dur[this.i] && guard++ < 5000) {
      this.acc -= this.seq.dur[this.i];
      this.i++;
      if (this.i >= this.seq.seq.length) {
        if (this.spec.loop) { this.i = 0; }
        else {
          this.i = this.seq.seq.length - 1;
          this.acc = 0;
          this.render();
          this.pause();
          return;
        }
      }
    }
    this.render();
    this.raf = requestAnimationFrame(() => this.loop());
  }
}

const grid = document.getElementById('grid');
const players = [];
for (const spec of DATA) {
  const card = document.createElement('div');
  card.className = 'card';
  const ms = totalDur(spec);
  const badges = [];
  if (spec.loop && spec.pingpong) badges.push('<span class="badge pp">循环·往返</span>');
  else if (spec.loop) badges.push('<span class="badge loop">循环</span>');
  else badges.push('<span class="badge once">播一次</span>');
  card.innerHTML = `
    <div class="card-head">
      <span class="name">${spec.label}</span>
      <span class="tag">${spec.category}</span>
    </div>
    <div class="sprite-wrap"><div class="sprite"></div></div>
    <div class="badges">${badges.join('')}</div>
    <div class="meta">
      <span>网格 <b>${spec.cols}×${spec.rows}</b></span>
      <span>帧数 <b>${spec.frames}</b></span>
      <span>时长 <b>${(ms / 1000).toFixed(2)}s</b></span>
    </div>
    <div class="bar"><div></div></div>
    <div class="controls">
      <span class="frame-label"></span>
      <div class="btns">
        <button class="play-btn">▶ 播放</button>
        <button class="replay-btn">↺ 重播</button>
      </div>
    </div>`;
  grid.appendChild(card);
  players.push(new SpritePlayer(card, spec));
}

let globalSpeed = 1;
document.getElementById('speed').addEventListener('input', (e) => {
  globalSpeed = parseFloat(e.target.value);
  document.getElementById('speed-val').textContent = globalSpeed.toFixed(2) + 'x';
  players.forEach(p => p.speed = globalSpeed);
});

let allPlaying = true;
document.getElementById('toggle-all').addEventListener('click', (e) => {
  allPlaying = !allPlaying;
  players.forEach(p => allPlaying ? p.play() : p.pause());
  e.target.textContent = allPlaying ? '⏸ 全部暂停' : '▶ 全部播放';
});
document.getElementById('replay-all').addEventListener('click', () => {
  players.forEach(p => p.restart());
});

players.forEach(p => p.play());
</script>
