<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F7F7FC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vivian&Nana">
<link rel="icon" type="image/png" href="/app-icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Vivian &amp; Nana</title>
<link rel="stylesheet" href="/memory-ui.css">
<style>
  :root {
    --primary: #0A84FF; --ios-blue: #0A84FF; --green: #34C759; --danger: #FF3B30; --warn: #FF9500;
    --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text2: #8E8E93;
    --border: rgba(60,60,67,0.12); --separator: rgba(60,60,67,0.08);
    --fill: rgba(120,120,128,0.12); --fill-strong: rgba(120,120,128,0.24);
    --sb: env(safe-area-inset-bottom); --st: env(safe-area-inset-top);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; background: var(--bg); }
  html, body { overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    min-height: 100%; min-height: 100dvh;
  }
  .app { position: relative; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }

  /* ── 次级页：全屏独立视图 ── */
  .page { display: none; position: fixed; inset: 0; max-width: 480px; margin: 0 auto; z-index: 30; transform-origin: center; flex-direction: column; background: var(--bg); }
  .page.open { display: flex; animation: pageIn .34s cubic-bezier(.22,.9,.28,1); }
  @keyframes pageIn { from { opacity: 0; transform: scale(.32); } to { opacity: 1; transform: scale(1); } }
  .page-header { display: flex; align-items: center; padding: calc(6px + var(--st)) 4px 6px; border-bottom: 0.5px solid var(--separator); background: var(--bg); }
  .back-btn { width: 40px; height: 40px; border: none; background: none; color: var(--ios-blue); font-size: 30px; font-weight: 300; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .back-btn:active { opacity: .5; }
  .page-title { font-size: 17px; font-weight: 700; flex: 1; text-align: center; margin-right: 40px; }
  .page-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .tab-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; flex-direction: column; min-height: 0; }
  .tab-content.active { display: flex; }
  .tab-content.scroll { display: block; }

  /* ── 微信对话界面（iOS 微信风格）── */
  .wx-chat { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #EDEDED; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; background: #EDEDED; }
  .wx-time { font-size: 11px; color: #B2B2B8; text-align: center; margin: 10px 0 4px; }
  .wx-row { display: flex; align-items: flex-end; gap: 8px; margin-top: 10px; }
  .wx-row.user { flex-direction: row-reverse; }
  .wx-avatar { width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0; object-fit: cover; }
  .wx-avatar.you { display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #34C759, #1E8E3E); }
  .wx-bubble-wrap { display: flex; flex-direction: column; align-items: flex-start; max-width: 72%; }
  .wx-bubble-wrap.user { align-items: flex-end; }
  .wx-name { font-size: 11px; color: #8E8E93; margin-bottom: 2px; padding-left: 4px; }
  .wx-bubble { padding: 9px 13px; font-size: 15px; line-height: 1.5; word-break: break-word; position: relative; }
  .wx-row.ai .wx-bubble { background: #fff; color: #1C1C1E; border-radius: 4px 18px 18px 18px; box-shadow: 0 1px 1px rgba(0,0,0,.04); }
  .wx-row.user .wx-bubble { background: #95EC69; color: #1C1C1E; border-radius: 18px 4px 18px 18px; }
  .wx-link { display: block; margin-top: 6px; padding: 7px 9px; border: 0.5px solid var(--separator); border-radius: 8px; background: rgba(0,0,0,.02); color: #0A66C2; font-size: 12px; text-decoration: none; word-break: break-all; }
  .wx-input-bar { display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px calc(8px + var(--sb)); background: #F7F7F7; border-top: 0.5px solid rgba(60,60,67,.12); }
  .wx-input-bar .wx-icon-btn { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: none; background: transparent; color: #5A5A5E; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .wx-input-bar .wx-icon-btn:active { background: rgba(0,0,0,.06); }
  .wx-input-bar .wx-icon-btn svg { width: 24px; height: 24px; display: block; }
  .wx-input-area { flex: 1; min-width: 0; position: relative; }
  .wx-input-bar textarea { width: 100%; box-sizing: border-box; border: none; border-radius: 8px; padding: 9px 12px; padding-right: 40px; font-size: 16px; resize: none; outline: none; min-height: 36px; max-height: 100px; font-family: inherit; line-height: 1.4; background: #fff; color: var(--text); display: block; }
  .wx-input-bar textarea:focus { box-shadow: 0 0 0 2px var(--ios-blue); }
  .wx-input-bar .wx-hold-talk { width: 100%; box-sizing: border-box; min-height: 36px; border: none; border-radius: 8px; background: #fff; color: #1C1C1E; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 9px 0; }
  .wx-input-bar .wx-hold-talk:active, .wx-input-bar .wx-hold-talk.recording { background: #E5E5EA; }
  /* 语音转文字按钮：内嵌在输入框右侧 */
  .wx-input-bar .wx-asr-btn { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); z-index: 2; width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent; color: #9A9AA0; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .wx-input-bar .wx-asr-btn:active { background: rgba(0,0,0,.06); }
  .wx-input-bar .wx-asr-btn svg { width: 21px; height: 21px; display: block; }
  .wx-input-bar .wx-send-btn { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--green); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(52,199,89,.35); padding: 0; }
  .wx-input-bar .wx-send-btn svg { width: 20px; height: 20px; display: block; }
  .wx-input-bar button.stop { background: var(--danger); box-shadow: 0 2px 6px rgba(255,59,48,.3); }
  .wx-drawer { max-height: 216px; overflow-y: auto; background: #F7F7F7; border-top: 0.5px solid rgba(60,60,67,.1); transition: max-height 200ms ease-out; }
  .wx-drawer.closed { max-height: 0; overflow: hidden; }
  .wx-emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 12px 10px; }
  .wx-emoji-grid button { background: transparent; border: none; font-size: 26px; padding: 6px 0; cursor: pointer; border-radius: 8px; }
  .wx-emoji-grid button:active { background: rgba(0,0,0,.06); }
  .wx-media-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 18px 14px; }
  .wx-media-grid .wx-media-item { display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: none; cursor: pointer; color: #1C1C1E; padding: 0; }
  .wx-media-grid .wx-media-icon { width: 54px; height: 54px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #5A5A5E; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .wx-media-grid .wx-media-icon svg { width: 28px; height: 28px; display: block; }
  .wx-media-grid .wx-media-label { font-size: 11px; }
  .wx-bubble img.wx-img { max-width: 180px; max-height: 220px; border-radius: 6px; display: block; }
  /* 微信聊天列表（主页面） */
  #wxListWrap, .wx-chat-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .wx-chat-list { flex: 1; overflow-y: auto; background: #fff; }
  .wx-contact { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 0.5px solid rgba(60,60,67,.08); }
  .wx-contact:active { background: #F2F2F2; }
  .wx-contact-avatar { width: 48px; height: 48px; border-radius: 6px; flex-shrink: 0; object-fit: cover; }
  .wx-contact-info { flex: 1; min-width: 0; }
  .wx-contact-name { font-size: 16px; font-weight: 500; color: #1C1C1E; }
  .wx-contact-preview { font-size: 13px; color: #8E8E93; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wx-contact-time { font-size: 11px; color: #B2B2B8; flex-shrink: 0; align-self: flex-start; margin-top: 2px; }

  /* ── 主页：Q 版桌宠舞台 + 聊天面板 ── */
  #tabDirect { position: relative; overflow: hidden; }
  .stage { position: absolute; inset: 0; background: var(--bg); }
  /* ── Q 版桌宠舞台：CSS 雪碧图，与桌面端共用同一套 3×2 六态图集 ── */
  .pet-layer { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; z-index: 1; }
  .pet-slot { position: relative; flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; justify-content: center; transition: flex-grow 320ms cubic-bezier(.2,.8,.25,1), opacity 240ms ease, transform 320ms cubic-bezier(.2,.8,.25,1); }
  /* 单角色模式：非当前角色收拢淡出，当前角色占满舞台 */
  .stage:not(.both) .pet-slot[data-active="false"] { flex-grow: 0; opacity: 0; transform: translateY(5%); pointer-events: none; }
  .pet-figure { position: relative; }
  .pet-shadow { position: absolute; left: 25%; right: 25%; bottom: 2%; height: 7%; border-radius: 50%; background: radial-gradient(ellipse, rgba(53,39,67,.28), rgba(53,39,67,0)); filter: blur(3px); animation: chibi-shadow-breathe 4.1s ease-in-out infinite; pointer-events: none; }
  .pet-sprite { position: absolute; inset: 0; background-image: var(--atlas-url); background-repeat: no-repeat; background-size: 300% 200%; background-position: 0% 0%; filter: drop-shadow(0 8px 8px rgba(44,30,61,.22)); transform-origin: 50% 90%; animation: chibi-idle-breathe 4.1s ease-in-out infinite; transition: filter 160ms ease; }
  .pet-sprite.pose-idle { background-position: 0% 0%; }
  .pet-sprite.pose-happy { background-position: 50% 0%; animation: chibi-happy-pop 620ms cubic-bezier(.2,.85,.28,1.18) both; }
  .pet-sprite.pose-drag { background-position: 100% 0%; animation: chibi-drag-sway 460ms ease-in-out infinite alternate; }
  .pet-sprite.pose-dizzy { background-position: 0% 100%; animation: chibi-dizzy 900ms ease-in-out infinite; }
  .pet-sprite.pose-talk { background-position: 50% 100%; animation: chibi-talk 420ms ease-in-out infinite alternate; }
  .pet-sprite.pose-listen { background-position: 100% 100%; animation: chibi-listen 1.3s ease-in-out infinite alternate; }
  .pet-bubble { position: absolute; display: none; max-width: 70%; padding: 9px 13px; border-radius: 16px; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--text); font-size: 13px; line-height: 1.5; word-break: break-word; box-shadow: 0 4px 16px rgba(0,0,0,.12); border: 0.5px solid var(--separator); z-index: 3; }
  .pet-bubble::after { content: ''; position: absolute; bottom: -6px; left: 20px; width: 12px; height: 12px; background: rgba(255,255,255,.92); border-right: 0.5px solid var(--separator); border-bottom: 0.5px solid var(--separator); transform: rotate(45deg); }
  .pet-bubble.show { display: block; animation: bubbleIn .25s ease; }
  @keyframes chibi-idle-breathe { 0%, 100% { transform: translateY(0) rotate(-.4deg); } 50% { transform: translateY(-1.8%) rotate(.5deg); } }
  @keyframes chibi-shadow-breathe { 0%, 100% { transform: scaleX(1); opacity: .72; } 50% { transform: scaleX(.88); opacity: .52; } }
  @keyframes chibi-happy-pop { 0% { transform: translateY(2%) scale(.95, 1.04); } 42% { transform: translateY(-6%) scale(1.05, .96) rotate(1.2deg); } 72% { transform: translateY(1%) scale(.98, 1.02) rotate(-.6deg); } 100% { transform: translateY(0) scale(1); } }
  @keyframes chibi-drag-sway { from { transform: translateY(1%) rotate(-3deg) scale(.98, 1.02); } to { transform: translateY(-1%) rotate(3deg) scale(1.02, .98); } }
  @keyframes chibi-dizzy { 0%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-2%) rotate(-2deg); } 75% { transform: translateX(2%) rotate(2deg); } }
  @keyframes chibi-talk { from { transform: translateY(0) scaleY(1); } to { transform: translateY(-1.5%) scaleY(1.015); } }
  @keyframes chibi-listen { from { transform: translateX(-1%) rotate(-1deg); } to { transform: translateX(1%) rotate(1deg); } }
  @keyframes bubbleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .chat-panel { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: transparent; z-index: 4; max-height: 100%; }
  .chat-panel.collapsed { display: none; }
  .direct-msgs { flex: 1 1 auto; min-height: 0; max-height: calc(100vh - 70px); overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: transparent; }
  .direct-row { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .direct-row.user { align-items: flex-end; }
  .direct-bubble { max-width: 76%; padding: 10px 14px; font-size: 15px; line-height: 1.55; word-break: break-word; }
  .direct-row.ai .direct-bubble { background: #fff; color: var(--text); border-radius: 18px 18px 18px 4px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .direct-row.user .direct-bubble { background: var(--ios-blue); color: #fff; border-radius: 18px 18px 4px 18px; }
  .direct-meta { font-size: 11px; color: var(--text2); }
  .direct-row.user .direct-meta { text-align: right; }
  .direct-time { font-size: 11px; color: var(--text2); text-align: center; margin: 2px 0; }
  .direct-input-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px; background: transparent; border-top: 0.5px solid var(--separator); }
  .direct-input-bar textarea { flex: 1; border: none; border-radius: 18px; padding: 7px 14px; font-size: 16px; resize: none; outline: none; min-height: 38px; max-height: 100px; font-family: inherit; line-height: 1.4; background: var(--fill); color: var(--text); }
  .direct-input-bar textarea:focus { background: #fff; box-shadow: 0 0 0 2px var(--ios-blue); }
  .direct-input-bar button { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--ios-blue); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(10,132,255,.35); }
  .direct-input-bar button svg { width: 18px; height: 18px; display: block; }
  .direct-input-bar button.stop { background: var(--danger); box-shadow: 0 2px 6px rgba(255,59,48,.3); }

  .list-view { padding: 12px 14px calc(2px + var(--sb)); display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .card .title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .sub { font-size: 12px; color: var(--text2); }
  .card .content { font-size: 13.5px; color: var(--text); margin-top: 4px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .card .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .btn { padding: 7px 14px; border: none; border-radius: 10px; background: var(--ios-blue); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .05s; }
  .btn:active { opacity: .8; transform: scale(.97); }
  .btn.outline { background: none; color: var(--ios-blue); box-shadow: inset 0 0 0 1px var(--fill-strong); }
  .btn.danger { background: none; color: var(--danger); box-shadow: inset 0 0 0 1px rgba(255,59,48,.3); }
  .btn.small { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
  .btn:disabled { opacity: .5; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; font-weight: 600; }
  .field input, .field textarea, .field select { width: 100%; border: none; border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit; outline: none; background: var(--fill); color: var(--text); }
  .field input:focus, .field textarea:focus, .field select:focus { background: #fff; box-shadow: 0 0 0 2px var(--ios-blue); }
  .field textarea { resize: vertical; min-height: 60px; }
  .loading { text-align: center; padding: 28px; color: var(--text2); }
  .error { color: var(--danger); background: rgba(255,59,48,.08); border: 0.5px solid rgba(255,59,48,.2); padding: 10px 14px; border-radius: 12px; margin: 10px 14px; font-size: 13px; }
  .empty { text-align: center; padding: 36px 20px; color: var(--text2); font-size: 13px; }
  .presence-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .presence-badge.online { background: rgba(52,199,89,.15); color: #248A3D; }
  .presence-badge.busy { background: rgba(255,149,0,.16); color: #C93400; }
  .presence-badge.rest { background: rgba(10,132,255,.14); color: #0A66C2; }
  .presence-badge.offline { background: var(--fill); color: var(--text2); }
  .note-item .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .note-item .tag { font-size: 11px; font-weight: 600; background: rgba(10,132,255,.12); color: var(--ios-blue); padding: 2px 8px; border-radius: 20px; }
  .note-item { cursor: pointer; }
  /* 笔记左滑：露出编辑/删除 */
  .note-swipe { position: relative; overflow: hidden; border-radius: 12px; margin-bottom: 12px; }
  .note-actions { position: absolute; top: 0; right: 0; bottom: 0; display: flex; }
  .note-actions button { width: 74px; border: none; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .note-actions .act-edit { background: #FF9500; }
  .note-actions .act-del { background: #FF3B30; }
  .note-front { position: relative; z-index: 1; background: #fff; transform: translateX(0); transition: transform .25s cubic-bezier(.32,.72,0,1); will-change: transform; touch-action: pan-y; }
  .note-swipe.open .note-front { transform: translateX(-148px); }
  .note-swipe.dragging .note-front { transition: none; }
  /* ── 记忆页：角色切换标签 ── */
  .mem-tabs { display: flex; gap: 8px; padding: 12px 14px 4px; flex-shrink: 0; }
  .mem-tab { flex: 1; padding: 9px 0; border: none; border-radius: 12px; background: var(--fill); color: var(--text2); font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s, color .2s; }
  .mem-tab.active { background: var(--ios-blue); color: #fff; box-shadow: 0 4px 12px rgba(10,132,255,.35); }
  /* ── 记忆卡片：类型徽章 + 说话者 + 内容 ── */
  .mem-card { background: var(--card); border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05); border: 2px solid transparent; }
  .mem-card.border-vivian { border-color: #FFD60A; background: rgba(255, 214, 10, 0.04); }
  .mem-card.border-nana { border-color: #FF5AA4; background: rgba(255, 90, 164, 0.04); }
  .mem-card.border-user { border-color: #34C759; background: rgba(52, 199, 89, 0.04); }
  .mem-card.border-inner-os { border-color: #87B4DC; background: rgba(135, 180, 220, 0.08); border-radius: 28px 32px 30px 26px / 30px 26px 32px 28px; }
  .mem-card .mem-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .mem-tag { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .2px; }
  .mem-time { font-size: 11px; color: var(--text2); margin-left: auto; flex-shrink: 0; }
  .mem-speaker { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .mem-speaker .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .mem-content { font-size: 14px; line-height: 1.6; color: var(--text); word-break: break-word; white-space: pre-wrap; }
  .mem-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .mem-bar { flex: 1; height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
  .mem-bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #FFD60A, #FF9500); }
  .mem-imp { font-size: 10px; color: var(--text2); flex-shrink: 0; }
  .mem-section { font-size: 13px; color: var(--text2); font-weight: 700; letter-spacing: .3px; margin: 16px 4px 8px; }
  .mem-section:first-child { margin-top: 4px; }
  .todo-item { display: flex; align-items: flex-start; gap: 12px; }

<script src="/memory-presentation.js"></script>

<script>
let currentCharId = '';
let wxActiveChar = '';
let memCharList = [];          // 记忆页角色列表（[{id,name}]）
let memActiveChar = '';        // 记忆页当前选中角色
let lastToastId = 0;
let currentConfirmations = [];
let currentConfirmId = null;
let currentNoteId = null;
let noteBlocksDirty = [];
let wxLoading = false, directLoading = false;

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) {
    let err = await res.text();
    try { err = JSON.parse(err).error || err; } catch (e) {}
    throw new Error(err || 'HTTP ' + res.status);
  }
  return res.json();
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatTime(ts) { if (!ts) return ''; const d = new Date(ts * 1000); return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
function formatDate(ts) { if (!ts) return ''; const d = new Date(ts * 1000); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function formatDateTime(ts) { if (!ts) return ''; return formatDate(ts) + ' ' + formatTime(ts); }
function extractLinks(text) { const re = /https?:\/\/[^\s<>"'）)]+/g; return (text || '').match(re) || []; }
function charName(id) { return (id === 'vivian') ? 'Vivian' : (id === 'nana' ? 'Nana' : (id || 'AI')); }
// 输入框占位用英文名：Vivian / Nana
function placeholderCharName(id) { return id === 'vivian' ? 'Vivian' : (id === 'nana' ? 'Nana' : (id || 'AI')); }
// 角色真实头像（与电脑端一致：public/{Char}/icon.png，经资源接口托管）
function charAvatarUrl(id) {
  return '/remote/model/' + (id ? id.charAt(0).toUpperCase() + id.slice(1) : 'Vivian') + '/icon.png';
}
function charAvatarHtml(id, className) {
  return '<span class="' + className + ' avatar-frame">' + escapeHtml(charName(id).charAt(0)) +
    '<img src="' + charAvatarUrl(id) + '" alt="" loading="lazy" onerror="this.remove()"></span>';
}

// ── 角色选择 ──
async function loadCharacters() {
  try {
    const data = await api('/api/characters');
    // 默认显示 Vivian（不受后端 active_id 影响）
    currentCharId = (data.characters || []).some(c => c.id === 'vivian') ? 'vivian'
      : (data.active_id || (data.characters.length > 0 ? data.characters[0].id : ''));
    if (!currentCharId) return;
    petActiveChar = currentCharId; // 同步舞台显示角色与当前角色，避免角色与占位符不一致
    memCharList = (data.characters || []).map(c => ({ id: c.id, name: charName(c.id) }));
    memActiveChar = currentCharId;
    loadWxHistory();
    loadDirectHistory();
    initPets();
    updateChatForChar(currentCharId);
    if (document.getElementById('pageMemory').classList.contains('open')) loadMemories();
  } catch (e) { console.error('加载角色失败:', e); }
}
async function switchCharacter(charId) {
  currentCharId = charId;
  petActiveChar = charId;
  petBothMode = false;
  layoutPets();
  updateChatForChar(charId);
  document.getElementById('wxMessages').innerHTML = '';
  document.getElementById('directMessages').innerHTML = '';
  loadWxHistory();
  loadDirectHistory();
}

// ── 主页 / 次级页导航 ──
function updateNavigation(id) {
  document.querySelectorAll('.mobile-nav [data-page]').forEach(button => {
    const active = button.dataset.page === id;
    if (active) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
}
function openPage(el, id) {
  document.activeElement?.blur();
  const rect = el ? el.getBoundingClientRect() : null;
  closeNavigation();
  document.querySelectorAll('.page').forEach(p => p.classList.remove('open'));
  const page = document.getElementById('page' + id.charAt(0).toUpperCase() + id.slice(1));
  if (page) {
    if (rect) {
      page.style.transformOrigin = (rect.left + rect.width / 2) + 'px ' + (rect.top + rect.height / 2) + 'px';
    } else {
      page.style.transformOrigin = 'center';
    }
    page.classList.add('open');
    updateNavigation(id);
  }
  if (id === 'wechat') { showWxList(); }
  else if (id === 'memory') loadMemories();
  else if (id === 'notes') loadNotes();
  else if (id === 'todo') { loadTodos(); loadTasks(); }
}
function goHome() {
  document.activeElement?.blur();
  closeNavigation();
  document.querySelectorAll('.page').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  const t = document.getElementById('tabDirect');
  if (t) t.classList.add('active');
  updateNavigation('home');
}

// ── 微信对话 ──
// 显示聊天列表主页面
function showWxList() {
  document.getElementById('wxChatWrap').style.display = 'none';
  document.getElementById('wxListWrap').style.display = 'flex';
  loadWxContacts();
}
// 返回聊天列表
function wxBackToList() {
  document.getElementById('wxChatWrap').style.display = 'none';
  document.getElementById('wxListWrap').style.display = 'flex';
  loadWxContacts();
}
// 进入某角色私聊
function openWxChat(charId) {
  wxActiveChar = charId;
  document.getElementById('wxChatTitle').textContent = placeholderCharName(charId);
  document.getElementById('wxListWrap').style.display = 'none';
  document.getElementById('wxChatWrap').style.display = 'flex';
  const input = document.getElementById('wxInput');
  input.placeholder = '对' + placeholderCharName(charId) + '说...';
  const msgs = document.getElementById('wxMessages');
  msgs.innerHTML = '';
  delete msgs.dataset.loaded; // 允许重新加载该角色历史
  loadWxHistory();
}
async function loadWxContacts() {
  const el = document.getElementById('wxContactList');
  el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const data = await api('/api/characters');
    el.innerHTML = '';
    for (const c of data.characters) {
      let preview = '', lastTs = 0;
      try {
        const h = await api('/api/characters/' + c.id + '/history?channel=wechat&limit=1');
        const last = (h.history || []).filter(x => x.role !== 'system').pop();
        if (last) { preview = last.content; lastTs = last.timestamp; }
      } catch (e) {}
      const row = document.createElement('button');
      row.className = 'wx-contact';
      row.type = 'button';
      row.onclick = () => openWxChat(c.id);
      row.innerHTML =
        charAvatarHtml(c.id, 'wx-contact-avatar') +
        '<div class="wx-contact-info">' +
          '<div class="wx-contact-name">' + escapeHtml(c.name) + '</div>' +
          '<div class="wx-contact-preview">' + escapeHtml(preview || '暂无消息') + '</div>' +
        '</div>' +
        '<div class="wx-contact-time">' + (lastTs ? formatTime(lastTs) : '') + '</div>';
      el.appendChild(row);
    }
  } catch (e) { el.innerHTML = '<div class="error">加载失败: ' + escapeHtml(e.message) + '</div>'; }
}
function wxTimeRow(ts) {
  const d = document.createElement('div');
  d.className = 'wx-time';
  d._ts = ts;
  d.textContent = formatTime(ts);
  return d;
}
// 时间相近（5 分钟内）的消息归为一组，只显示一次时间
function maybeAppendTime(msgs, ts) {
  if (!ts) return;
  const times = msgs.querySelectorAll('.wx-time');
  const last = times[times.length - 1];
  if (!last || ts - last._ts >= 300) msgs.appendChild(wxTimeRow(ts));
}
function renderWxRow(role, content, isUser, links, imgSrc) {
  const row = document.createElement('div');
  row.className = 'wx-row ' + (isUser ? 'user' : 'ai');
  let avatarHtml;
  if (isUser) {
    avatarHtml = '<div class="wx-avatar you">我</div>';
  } else {
    avatarHtml = charAvatarHtml(wxActiveChar, 'wx-avatar');
  }
  let bodyHtml;
  if (imgSrc) {
    bodyHtml = '<div class="wx-bubble" style="padding:4px;background:transparent;box-shadow:none;"><img class="wx-img" src="' + imgSrc + '" alt="图片"></div>';
  } else {
    bodyHtml = '<div class="wx-bubble">' + escapeHtml(content) + '</div>';
  }
  let html = avatarHtml + '<div class="wx-bubble-wrap' + (isUser ? ' user' : '') + '">';
  if (!isUser) html += '<div class="wx-name">' + charName(wxActiveChar) + '</div>';
  html += bodyHtml + '</div>';
  row.innerHTML = html;
  if (!imgSrc) {
    const bubble = row.querySelector('.wx-bubble');
    if (links && links.length) links.forEach(u => { const a=document.createElement('a'); a.className='wx-link'; a.href=u; a.target='_blank'; a.rel='noopener'; a.textContent='🔗 '+u; bubble.appendChild(a); });
  }
  return row;
}
function onWxInput() {
  const input = document.getElementById('wxInput');
  const sendBtn = document.getElementById('wxSendBtn');
  const hasText = input.value.trim().length > 0;
  sendBtn.style.display = hasText ? 'flex' : 'none';
  if (hasText) closeWxDrawers();
  // 自动增高（最多 100px）
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
}
async function sendWx() {
  const input = document.getElementById('wxInput');
  const text = input.value.trim();
  if (!text || wxLoading || !wxActiveChar) return;
  input.value = '';
  input.style.height = 'auto';
  onWxInput();
  input.focus();
  await sendWxText(text);
}
async function sendWxText(text) {
  text = text.trim();
  if (!text || wxLoading || !wxActiveChar) return;
  wxLoading = true;
  document.getElementById('wxStopBtn').style.display = 'flex';
  const msgs = document.getElementById('wxMessages');
  const now = Date.now() / 1000;
  maybeAppendTime(msgs, now);
  msgs.appendChild(renderWxRow('user', text, true, []));
  msgs.scrollTop = msgs.scrollHeight;
  try {
    const data = await api('/api/chat', { method: 'POST', body: JSON.stringify({ message: text, character_id: wxActiveChar, channel: 'wechat' }) });
    maybeAppendTime(msgs, now);
    msgs.appendChild(renderWxRow('ai', data.reply, false, extractLinks(data.reply)));
    msgs.scrollTop = msgs.scrollHeight;
  } catch (e) {
    const s = document.createElement('div'); s.className='wx-time'; s.textContent='错误: ' + e.message; msgs.appendChild(s);
  } finally {
    wxLoading = false;

// ── 录音 → 16kHz f32 PCM → base64 → /api/asr ──
function getWxMediaStream() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return Promise.reject(new Error('当前环境不支持录音（需 HTTPS 或本机访问）'));
  }
  return navigator.mediaDevices.getUserMedia({ audio: true });
}
function wxRecordUntilStop(stream) {
  const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
  const supported = candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  let rec;
  try { rec = supported ? new MediaRecorder(stream, { mimeType: supported }) : new MediaRecorder(stream); }
  catch (e) { rec = new MediaRecorder(stream); }
  rec.__chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) rec.__chunks.push(e.data); };
  rec.onerror = () => { if (window.__wxRec === rec) window.__wxRec = null; };
  window.__wxRec = rec;
  rec.start();
}
function wxStopRecording() {
  return new Promise((resolve) => {
    const rec = window.__wxRec;
    window.__wxRec = null;
    if (!rec) { resolve(null); return; }
    const done = () => {
      const chunks = rec.__chunks || [];
      resolve(chunks.length ? new Blob(chunks, { type: rec.mimeType || 'audio/webm' }) : null);
    };
    if (rec.state === 'inactive') { done(); return; }
    rec.onstop = done;
    try { rec.stop(); } catch (e) { resolve(null); }
  });
}
async function blobToPcm16k(blob) {
  const arrayBuffer = await blob.arrayBuffer();
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtx();
  const audioBuf = await ctx.decodeAudioData(arrayBuffer);
  const srcRate = audioBuf.sampleRate || 16000;
  const channels = audioBuf.numberOfChannels;
  const targetRate = 16000;
  const outLen = Math.max(1, Math.ceil(audioBuf.length * targetRate / srcRate));
  const output = new Float32Array(outLen);
  const d0 = audioBuf.getChannelData(0);
  const d1 = channels > 1 ? audioBuf.getChannelData(1) : null;
  const ratio = srcRate / targetRate;
  for (let i = 0; i < outLen; i++) {
    const srcIdx = i * ratio;
    const i0 = Math.floor(srcIdx);
    const i1 = Math.min(i0 + 1, audioBuf.length - 1);
    const frac = srcIdx - i0;
    const s0 = d1 ? (d0[i0] + d1[i0]) * 0.5 : d0[i0];
    const s1 = d1 ? (d0[i1] + d1[i1]) * 0.5 : d0[i1];
    output[i] = s0 + (s1 - s0) * frac;
  }
  try { ctx.close(); } catch (e) {}
  return output;
}
function pcmToBase64(pcm) {
  const bytes = new ArrayBuffer(pcm.length * 4);
  const view = new DataView(bytes);
  for (let i = 0; i < pcm.length; i++) view.setFloat32(i * 4, pcm[i], true);
  const u8 = new Uint8Array(bytes);
  let bin = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < u8.length; i += CHUNK) {
    bin += String.fromCharCode.apply(null, u8.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}
async function wxRecognize(blob) {
  if (!blob) return '';
  const pcm = await blobToPcm16k(blob);
  if (pcm.length === 0) return '';
  const data = await api('/api/asr', { method: 'POST', body: JSON.stringify({ samples_b64: pcmToBase64(pcm) }) });
  return (data.text || '').trim();
}

async function wxAsrToText() {
  if (wxLoading) return;

// 笔记左滑手势（触摸 + 鼠标），并避免触发页面返回手势
let noteSwipeBusy = false;
const NOTE_ACTIONS_W = 148;
function closeAllNoteSwipes() {
  document.querySelectorAll('.note-swipe.open').forEach(w => { w.classList.remove('open'); });
}
function bindNoteSwipe(wrap) {
  const front = wrap.querySelector('.note-front');
  let startX = 0, startY = 0, startTransform = 0, dragging = false, active = false;

  const begin = (x, y) => {
    noteSwipeBusy = true;
    startX = x; startY = y; dragging = false; active = false;
    closeAllNoteSwipes(); // 打开新滑块时收起其它滑块（若后续未拖动则不改变当前状态）
  };
  const move = (x) => {
    const dx = x - startX;
    if (!active) {
      if (Math.abs(dx) < 10) return;
      if (Math.abs(dx) <= Math.abs(wrap.__dy || 0)) return; // 纵向滚动优先，不视为左滑
      active = true;
      startTransform = wrap.classList.contains('open') ? -NOTE_ACTIONS_W : 0;
      front.classList.add('dragging');
    }
    let v = startTransform + dx;
    v = Math.max(-NOTE_ACTIONS_W, Math.min(0, v));
    front.style.transform = 'translateX(' + v + 'px)';
  };
  const end = (x) => {
    const dx = x - startX;
    const shouldOpen = active ? (dx < -NOTE_ACTIONS_W * 0.35) : false; // 非拖动（点击）保持收起
    wrap.classList.toggle('open', shouldOpen);
    front.classList.remove('dragging');
    front.style.transition = '';
    front.style.transform = wrap.classList.contains('open') ? 'translateX(-' + NOTE_ACTIONS_W + 'px)' : 'translateX(0)';
    setTimeout(() => { noteSwipeBusy = false; }, 120);
  };

  // 触摸
  wrap.addEventListener('touchstart', (e) => { const t = e.touches[0]; wrap.__dy = 0; begin(t.clientX, t.clientY); }, { passive: true });
  wrap.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    wrap.__dy = t.clientY - startY;
    move(t.clientX);
  }, { passive: true });
  wrap.addEventListener('touchend', (e) => { const t = e.changedTouches[0]; end(t.clientX); }, { passive: true });
  // 鼠标（桌面预览）
  let mDown = false;
  wrap.addEventListener('mousedown', (e) => { mDown = true; begin(e.clientX, e.clientY); });
  window.addEventListener('mousemove', (e) => { if (mDown && active) move(e.clientX); });
  window.addEventListener('mouseup', (e) => { if (mDown) { mDown = false; if (active) end(e.clientX); else noteSwipeBusy = false; } });
}

function normalizeBlocks(blocks) {
  return blocks.map(b => {
    if (b.type === 'heading') return { type: 'heading', level: b.level || 1, text: b.text || '' };
    if (b.type === 'list') return { type: 'list', items: (b.items||[]).join('\n'), ordered: !!b.ordered };
    if (b.type === 'quote') return { type: 'quote', text: b.text || '', author: b.author || '' };
    if (b.type === 'callout') return { type: 'callout', text: b.text || '', emoji: b.emoji || '' };
    if (b.type === 'card') return { type: 'card', title: b.title || '', body: b.body || '' };
    if (b.type === 'divider') return { type: 'divider', emoji: b.emoji || '' };
    if (b.type === 'image') return { type: 'image', url: b.url || '', caption: b.caption || '' };
    if (b.type === 'tags') return { type: 'tags', items: (b.items||[]).join('\n') };
    return { type: 'paragraph', text: b.text || '' };
  });
}
function buildBlocks() {
  return noteBlocksDirty.map(b => {
    switch (b.type) {
      case 'paragraph': return { type: 'paragraph', text: b.text };
      case 'heading': return { type: 'heading', level: Math.min(Math.max(parseInt(b.level)||1,1),3), text: b.text };
      case 'list': return { type: 'list', items: (b.items||'').split('\n').filter(x=>x), ordered: !!b.ordered };
      case 'quote': { const q={type:'quote', text:b.text}; if(b.author) q.author=b.author; return q; }
      case 'callout': { const c={type:'callout', text:b.text}; if(b.emoji) c.emoji=b.emoji; return c; }
      case 'card': return { type:'card', title:b.title||'', body:b.body||'' };
      case 'divider': return { type:'divider', emoji:b.emoji||'' };
      case 'image': { const im={type:'image', url:b.url}; if(b.caption) im.caption=b.caption; return im; }
      case 'tags': return { type:'tags', items:(b.items||'').split('\n').filter(x=>x) };
      default: return { type:'paragraph', text:b.text };
    }
  });
}
function renderNoteBlocks() {
  const el = document.getElementById('noteBlocks');
  el.innerHTML = '';
  noteBlocksDirty.forEach((b, i) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'border:1px solid var(--border);border-radius:8px;padding:8px;';
    const sel = document.createElement('select');
    const opts = { paragraph:'段落', heading:'标题', list:'列表', quote:'引用', callout:'提示', divider:'分隔线', card:'卡片', image:'图片', tags:'标签' };
    Object.keys(opts).forEach(k => { const o=document.createElement('option'); o.value=k; o.textContent=opts[k]; o.selected=(b.type===k); sel.appendChild(o); });
    sel.onchange = (e) => { noteBlocksDirty[i].type = e.target.value; renderNoteBlocks(); };
    wrap.appendChild(sel);
    const textarea = document.createElement('textarea');
    textarea.rows = 2;
    textarea.placeholder = '内容';
    if (b.type === 'heading') { textarea.value = b.level ? '#' + b.level + ' ' + (b.text||'') : ''; }
    else if (b.type === 'list' || b.type === 'tags') { textarea.value = b.items || ''; textarea.placeholder='每行一项'; }
    else if (b.type === 'card') { textarea.value = (b.title||'') + '\n' + (b.body||''); textarea.rows=3; textarea.placeholder='标题\n正文'; }
    else if (b.type === 'image') { textarea.value = b.url || ''; textarea.placeholder='图片 URL'; }
    else { textarea.value = b.text || ''; }
    textarea.oninput = (e) => { const v = e.target.value; const t = noteBlocksDirty[i].type;
      if (t==='heading') { const m=v.match(/^#(\d)\s*(.*)$/); noteBlocksDirty[i].level=m?m[1]:''; noteBlocksDirty[i].text=m?m[2]:v; }
      else if (t==='list'||t==='tags') noteBlocksDirty[i].items=v;
      else if (t==='card') { const idx=v.indexOf('\n'); if(idx>=0){noteBlocksDirty[i].title=v.slice(0,idx);noteBlocksDirty[i].body=v.slice(idx+1);} else {noteBlocksDirty[i].title=v;noteBlocksDirty[i].body='';} }
      else noteBlocksDirty[i].text=v; };
    wrap.appendChild(textarea);
    const del = document.createElement('button');
    del.className = 'btn small danger';
    del.textContent = '删除';
    del.style.marginTop='6px';
    del.onclick = () => { noteBlocksDirty.splice(i,1); renderNoteBlocks(); };
    wrap.appendChild(del);
    el.appendChild(wrap);
  });
}
function addBlock(type) { noteBlocksDirty.push({ type, text:'', items:'', level:1, title:'', body:'', url:'', emoji:'' }); renderNoteBlocks(); }

async function saveTask() {
  const message = document.getElementById('taskMessage').value.trim();
  const timeSpec = document.getElementById('taskTime').value.trim();
  if (!message || !timeSpec) { alert('请填写内容和时间'); return; }
  const ts = parseTimeSpec(timeSpec);
  if (ts === null) { alert('时间格式无法解析'); return; }
  const repeat = parseInt(document.getElementById('taskRepeat').value) || null;
  try {
    await api('/api/tasks', { method: 'POST', body: JSON.stringify({ message, scheduled_time: ts, repeat_interval: repeat }) });
    hideModal('taskModal'); loadTasks();
  } catch (e) { alert('添加失败: ' + e.message); }
}
function parseTimeSpec(spec) {
  spec = spec.trim();
  const dt = new Date(spec);
  if (!isNaN(dt.getTime()) && spec.indexOf('T') >= 0) return dt.getTime()/1000;
  const m = spec.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) { const d = new Date(+m[1], +m[2]-1, +m[3], 9, 0, 0); return d.getTime()/1000; }
  const dur = spec.match(/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/);
  if (dur) {
    let secs = 0;
    if (dur[1]) secs += +dur[1]*86400;
    if (dur[2]) secs += +dur[2]*3600;
    if (dur[3]) secs += +dur[3]*60;
    if (dur[4]) secs += +dur[4];
    if (secs > 0) return Date.now()/1000 + secs;
  }
  return null;
}

// ── Q 版桌宠渲染（主页舞台：单角色 / 双生）──
// 与桌面端共用同一套资源：3×2 六态主图集 + 3×2 眨眼序列，经 /remote/model/ 下发
// （dev 从 public/ 读，release 从 bundle 读）。
const PET_ASSET = {
  vivian: { atlas: '/remote/model/chibi/vivian-atlas.webp', blink: '/remote/model/chibi/motion/vivian/vivian-blink-sheet.webp' },
  nana: { atlas: '/remote/model/chibi/nana-atlas.webp', blink: '/remote/model/chibi/motion/nana/nana-blink-sheet.webp' },
};
const PET_IDS = {
  vivian: { slot: 'petSlotVivian', figure: 'figVivian', sprite: 'petVivian' },
  nana: { slot: 'petSlotNana', figure: 'figNana', sprite: 'petNana' },
};
const PET_CHARS = ['vivian', 'nana'];
const BLINK_FRAME_DURATIONS_MS = [55, 48, 58, 78, 70, 105];
const BLINK_MIN_DELAY_MS = 3200;
const BLINK_DELAY_RANGE_MS = 4300;

let petInitStarted = false;
let petBothMode = false;        // 双生模式（同时显示两个角色）
let petActiveChar = 'vivian';   // 当前发言对象
const petPose = { vivian: 'idle', nana: 'idle' };
const petPoseTimer = { vivian: 0, nana: 0 };
const petBlinkTimer = { vivian: 0, nana: 0 };
const petBlinkToken = { vivian: 0, nana: 0 };

/** 表情名 → 六态姿态。手机端只渲染主图集六态，不涉及走路/转身/施法序列。 */
function expressionToPose(name) {
  const v = String(name || '').toLowerCase();
  if (/pout|angry|annoy|dark|reach|confus/.test(v)) return 'drag';
  if (/dizzy|sweat|blank|tear|sad|sleep/.test(v)) return 'dizzy';
  if (/talk|speak|mouth/.test(v)) return 'talk';
  if (/listen|focus|look/.test(v)) return 'listen';
  if (/happy|love|star|shy|blush|smile|joy/.test(v)) return 'happy';
  return 'idle';
}

/** 中断眨眼序列并清掉它写在 sprite 上的行内样式，交回给姿态样式控制。 */
function clearBlinkFrames(charId) {
  petBlinkToken[charId] += 1;
  const sprite = document.getElementById(PET_IDS[charId].sprite);
  if (sprite) {
    sprite.style.backgroundImage = '';
    sprite.style.backgroundPosition = '';
  }
}

/** 切换姿态；durationMs > 0 时到点自动回 idle。 */
function setPose(charId, pose, durationMs) {
  const sprite = document.getElementById(PET_IDS[charId].sprite);
  if (!sprite) return;
  petPose[charId] = pose;
  clearBlinkFrames(charId);
  sprite.className = 'pet-sprite pose-' + pose;
  clearTimeout(petPoseTimer[charId]);
  petPoseTimer[charId] = 0;
  if (durationMs > 0) {
    petPoseTimer[charId] = setTimeout(() => setPose(charId, 'idle', 0), durationMs);
  }
}

/** 眨眼序列：切到眨眼图集逐帧播完，再排下一次。仅在 idle 且未被其他姿态接管时播放。 */
function playBlink(charId) {
  const sprite = document.getElementById(PET_IDS[charId].sprite);
  if (!sprite || petPose[charId] !== 'idle') return;
  const token = ++petBlinkToken[charId];
  let frame = 0;
  const step = () => {
    if (petBlinkToken[charId] !== token || petPose[charId] !== 'idle') return;
    if (frame >= BLINK_FRAME_DURATIONS_MS.length) {
      clearBlinkFrames(charId);
      scheduleBlink(charId);
      return;
    }
    sprite.style.backgroundImage = 'url(' + PET_ASSET[charId].blink + ')';
    sprite.style.backgroundPosition = (frame % 3) * 50 + '% ' + Math.floor(frame / 3) * 100 + '%';
    setTimeout(step, BLINK_FRAME_DURATIONS_MS[frame]);
    frame += 1;
  };
  step();
}

function scheduleBlink(charId) {
  clearTimeout(petBlinkTimer[charId]);
  petBlinkTimer[charId] = setTimeout(
    () => playBlink(charId),
    BLINK_MIN_DELAY_MS + Math.random() * BLINK_DELAY_RANGE_MS,
  );
}

// 角色使用聊天面板上方的舞台空间，消息和输入栏不遮挡角色。
function petUsableHeight() {
  const stageEl = document.getElementById('petStage');
  if (!stageEl) return window.innerHeight;
  const panel = document.querySelector('.chat-panel');
  const panelH = panel && !panel.classList.contains('collapsed') ? panel.getBoundingClientRect().height : 0;
  stageEl.style.setProperty('--panel-height', panelH + 'px');
  return Math.max(0, stageEl.getBoundingClientRect().height - panelH - 26);
}

/** 按可用高度与槽位宽度摆放角色：单角色占满舞台，双生各占半宽。 */
function layoutPets() {
  const layer = document.getElementById('petLayer');
  if (!layer) return;
  const usableH = petUsableHeight();
  const layerW = layer.clientWidth || window.innerWidth;
  const slotW = petBothMode ? layerW / 2 : layerW;
  const size = Math.max(
    72,
    Math.min(slotW * (petBothMode ? 0.96 : 0.88), usableH * (petBothMode ? 0.96 : 0.9)),
  );
  for (const cid of PET_CHARS) {
    const slot = document.getElementById(PET_IDS[cid].slot);
    const figure = document.getElementById(PET_IDS[cid].figure);
    if (slot) slot.dataset.active = String(petBothMode || cid === petActiveChar);
    if (figure) {
      figure.style.width = size + 'px';
      figure.style.height = size + 'px';
    }
  }
}

function updateChatForChar(charId) {
  document.querySelectorAll('[data-character]').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.character === (petBothMode ? 'both' : charId)));
  });
  const input = document.getElementById('directInput');
  if (!input) return;
  if (petBothMode) {
    input.placeholder = '对Vivian和Nana说点什么...';
  } else {
    input.placeholder = '对' + placeholderCharName(charId) + '说点什么...';
  }
}

function selectStageCharacter(charId) {
  // 与左右滑动使用相同的切换逻辑，保留现有对话记录。
  petActiveChar = charId;
  currentCharId = charId;
  petBothMode = false;
  updateChatForChar(charId);
  layoutPets();
}

function setBothMode(on) {
  petBothMode = !!on;
  layoutPets();
  updateChatForChar(petActiveChar || currentCharId);
}

/** 初始化 Q 版舞台：挂图集、启动眨眼循环、按舞台尺寸完成首次布局。 */
function initPets() {
  if (petInitStarted) return;
  petInitStarted = true;
  const stage = document.getElementById('petStage');
  for (const cid of PET_CHARS) {
    const sprite = document.getElementById(PET_IDS[cid].sprite);
    if (sprite) sprite.style.setProperty('--atlas-url', 'url(' + PET_ASSET[cid].atlas + ')');
    scheduleBlink(cid);
  }
  layoutPets();
  if (window.ResizeObserver && stage) {
    const observer = new ResizeObserver(() => layoutPets());
    observer.observe(stage);
    observer.observe(document.querySelector('.chat-panel'));
  }
  window.addEventListener('resize', layoutPets);
}

// 聊天面板状态；角色只通过按钮切换。
let chatPanelCollapsed = false;
function toggleChatPanel() {
  chatPanelCollapsed = !chatPanelCollapsed;
  const panel = document.querySelector('.chat-panel');
  if (panel) panel.classList.toggle('collapsed', chatPanelCollapsed);
  layoutPets();
}
function showBubble(charId, text) {
  const id = charId === 'vivian' ? 'bubbleVivian' : 'bubbleNana';
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  // 双生时两个槽位各占半宽，气泡分别落在各自的槽位中心（1/4、3/4）
  el.style.left = petBothMode ? (charId === 'vivian' ? '25%' : '75%') : '50%';
  el.style.transform = 'translateX(-50%)';
  el.style.top = petBothMode ? '18%' : '24%';
  el.classList.add('show');
  clearTimeout(showBubble._t);
  showBubble._t = setTimeout(() => el.classList.remove('show'), Math.min(text.length * 120 + 2000, 6000));
}

/** 说话：弹气泡 + 按表情名切姿态，结束后自动回 idle。 */
function speakPet(charId, text, expression) {
  showBubble(charId, text);
  const pose = expressionToPose(expression);
  setPose(charId, pose === 'idle' ? 'talk' : pose, 1600);
}

// ── 初始化 ──
// visualViewport 覆盖 iOS 键盘覆盖窗口的情况；缩放时保留浏览器原生放大行为。
let viewportFrame = 0;
let fullViewportHeight = window.innerHeight;
let viewportWidth = window.innerWidth;
function syncMobileViewport() {
  cancelAnimationFrame(viewportFrame);
  viewportFrame = requestAnimationFrame(() => {
    const viewport = window.visualViewport;
    if (viewport && Math.abs(viewport.scale - 1) > .05) return;
    const editing = document.activeElement?.matches('textarea, input:not([type="button"]):not([type="checkbox"]):not([type="file"]), select');
    if (Math.abs(window.innerWidth - viewportWidth) > 80) {
      viewportWidth = window.innerWidth;
      fullViewportHeight = window.innerHeight;
    }
    if (!editing) fullViewportHeight = window.innerHeight;
    const height = viewport ? viewport.height : window.innerHeight;
    const keyboard = editing && fullViewportHeight - height > 120;
    document.documentElement.classList.toggle('keyboard-open', !!keyboard);
    document.documentElement.style.setProperty('--app-height', height + 'px');
    document.documentElement.style.setProperty('--viewport-top', (viewport?.offsetTop || 0) + 'px');
    document.getElementById('app').style.top = (viewport?.offsetTop || 0) + 'px';
    layoutPets();
  });
}
window.visualViewport?.addEventListener('resize', syncMobileViewport);
window.visualViewport?.addEventListener('scroll', syncMobileViewport);
window.addEventListener('resize', syncMobileViewport);
document.addEventListener('focusin', syncMobileViewport);
document.addEventListener('focusout', syncMobileViewport);
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  const modal = document.querySelector('.modal-overlay:not(.hidden)');
  if (modal) { hideModal(modal.id); return; }
  goHome();
});
document.querySelectorAll('button[title]').forEach(button => button.setAttribute('aria-label', button.title));
document.querySelectorAll('.field').forEach(field => {
  const input = field.querySelector('input[id], textarea[id], select[id]');
  const label = field.querySelector('label');
  if (input && label) label.htmlFor = input.id;
});
document.querySelectorAll('.modal-overlay .modal').forEach(modal => {
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  const heading = modal.querySelector('h3');
  if (heading) {
    if (!heading.id) heading.id = modal.parentElement.id + 'Title';
    modal.setAttribute('aria-labelledby', heading.id);
  }
});
document.getElementById('directSendBtn').setAttribute('aria-label', '发送消息');
document.getElementById('wxSendBtn').setAttribute('aria-label', '发送消息');
document.getElementById('wxStopBtn').setAttribute('aria-label', '停止生成');
document.getElementById('wxInput').setAttribute('aria-label', '聊天消息');
closeNavigation();
syncMobileViewport();
initWxEmojiGrid();
loadCharacters();
setInterval(pollToasts, 5000);
setInterval(pollConfirmations, 3000);
</script>
