[package]
name = "vivian-browser-smoke"
version = "0.1.0"
edition = "2021"
[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png", "image-ico", "protocol-asset"] }
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs", "process", "io-util", "net"] }
chrono = "0.4"
once_cell = "1"
parking_lot = "0.12"
tracing = "0.1"
urlencoding = "2"
[build-dependencies]
tauri-build = "2"
[patch.crates-io]
wry = { path = "../../src-tauri/vendor/wry" }
tao = { path = "../vendor/tao" }

[dev-dependencies]
tempfile = "3"
