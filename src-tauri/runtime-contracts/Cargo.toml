[package]
name = "vivian-runtime-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "../tests/runtime_contracts.rs"

[[test]]
name = "chat_partner"
path = "../tests/chat_partner_contracts.rs"

[[test]]
name = "self_profile"
path = "../tests/self_profile_contracts.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
futures = "0.3"
parking_lot = "0.12"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
once_cell = "1"
regex = "1"
png = "0.18"
jieba-rs = "0.7"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Graphics_DirectX"] }
