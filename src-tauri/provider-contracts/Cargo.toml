[package]
name="vivian-provider-contracts"
version="0.1.0"
edition="2021"
publish=false

[lib]
path="../../scripts/provider-core-tests.rs"

[dependencies]
"anyhow"="1.0"
"async-trait"="0.1"
"axum"={"version"="0.7","features"=["ws"]}
"base64"="0.22"
"chrono"={"version"="0.4","features"=["serde"]}
"futures"="0.3"
"hmac"="0.12"
"once_cell"="1.20"
"parking_lot"="0.12"
"regex"="1.11"
"reqwest"={"version"="0.12","features"=["json","stream","rustls-tls","http2","multipart"],"default-features"=false}
"rusqlite"={"version"="0.32","features"=["bundled","load_extension","backup"]}
"serde"={"version"="1.0","features"=["derive"]}
"serde_json"="1.0"
"sha2"="0.10"
"thiserror"="2.0"
"tokio"={"version"="1.41","features"=["rt-multi-thread","macros","time","sync","fs","process","io-util","net"]}
"tokio-tungstenite"={"version"="0.24","features"=["rustls-tls-webpki-roots"]}
"tracing"="0.1"
"uuid"={"version"="1.11","features"=["v4","serde"]}
"windows"={"version"="0.61","features"=["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_HiDpi","Win32_UI_Shell","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_Media_Multimedia","Win32_System_Com","Win32_System_Console","Win32_System_Pipes","Win32_System_Kernel","Win32_System_IO","Win32_Storage_FileSystem","Win32_Security_Cryptography","Win32_UI_Input_KeyboardAndMouse","Win32_System_SystemInformation","Win32_System_Power","Foundation","Globalization","Media_SpeechRecognition","Media_SpeechSynthesis","Media_Core","Storage_Streams","Media_Ocr","Graphics_Imaging","Devices_Geolocation","Media_Control","Win32_Media_Audio","Win32_Media_Audio_Endpoints","Win32_Networking_NetworkListManager","Win32_NetworkManagement_IpHelper","Win32_NetworkManagement_Ndis","Win32_System_JobObjects","Win32_System_Threading","Win32_System_Environment","Win32_Security_Authorization","Win32_Security"]}
tempfile="3"

[profile.dev]
debug="line-tables-only"
incremental=false
codegen-units=16
